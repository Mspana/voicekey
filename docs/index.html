<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceKey</title>
  <meta name="description" content="Hold Space to type. Hold Ctrl to command.">
  <meta property="og:title" content="VoiceKey">
  <meta property="og:description" content="Hold Space to type. Hold Ctrl to command.">
  <meta property="og:image" content="images/hero.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="#">voicekey</a>
    <nav>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 class="wordmark">voicekey</h1>
      <p class="tagline">the <s>simplest</s> best* accessibility tool</p>
      <p class="fn">*for andrew</p>
      <p class="lead">Hold Space to type. Hold Ctrl to command.</p>
      <p><a class="btn" href="#contact">Ask for a copy</a></p>
    </section>

    <figure class="shot contain" data-file="images/hero.jpg">
      <img src="images/hero.jpg" alt="The VoiceKey window, ready to dictate" width="960" height="600">
    </figure>

    <section class="gallery" aria-label="VoiceKey in use">
      <figure class="shot contain" data-file="images/dictate.png">
        <img src="images/dictate.png" alt="VoiceKey listening" width="640" height="400">
        <figcaption>Hold Space</figcaption>
      </figure>
      <figure class="shot" data-file="images/grid.png">
        <img src="images/grid.png" alt="The mouse grid" width="640" height="400">
        <figcaption>zulu grid</figcaption>
      </figure>
      <figure class="shot" data-file="images/command.png">
        <img src="images/command.png" alt="Screen-edge glow while a command is taken" width="640" height="400">
        <figcaption>Hold Ctrl</figcaption>
      </figure>
    </section>

    <section id="contact" class="contact">
      <h2>Want a copy?</h2>
      <form id="contact-form" action="https://formspree.io/f/xvkpqzql" method="POST">
        <label>
          Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="VoiceKey">
        <p class="form-status" role="status" hidden></p>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <span class="wordmark">voicekey</span>
    <span>Windows · alpha</span>
  </footer>

  <script src="site.js"></script>
</body>
</html>
